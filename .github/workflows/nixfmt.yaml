name: nixfmt

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  nixfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check formatting
        run: nix build .#checks.x86_64-linux.format
