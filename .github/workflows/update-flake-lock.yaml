name: update flake lock

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 */3 * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Update flake lock
        run: nix flake update

      - name: Validate flake
        run: nix flake check --no-build

      - name: Build NixOS configuration
        run: nix build .#checks.x86_64-linux.nixos-smi-nix --no-link

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/update-flake-lock
          delete-branch: true
          add-paths: flake.lock
          commit-message: "⬆️ chore(deps): update flake inputs"
          title: "⬆️ chore(deps): update flake inputs"
          body: |
            Automated flake input update.

            Validation performed before opening or updating this pull request:
            - `nix flake check --no-build`
            - `nix build .#checks.x86_64-linux.nixos-smi-nix --no-link`
