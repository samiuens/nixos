name: deadnix

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  deadnix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run deadnix
        run: nix build .#checks.x86_64-linux.deadnix
